plugins { id 'com.android.application' }

android {
    namespace 'com.oceancatch'
    compileSdk 35

    defaultConfig {
        applicationId 'com.oceancatch'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
